  const original = validLeads().find(l=>l.id===id); if (!original) { location.hash='projects'; return; }
  if (original.status === 'nieuw') { followups[id] = {...followups[id],status:'bekeken'}; save(); } const l = stateLead(original);
  shell(`<a class="back-link" href="#projects">Terug naar projecten</a><div class="detail-title"><div><span class="pill orange">${e(l.type)}</span><h1>${e(l.address)}</h1><p class="muted">${e(l.municipality)} · ${e(l.date)}</p></div>${scoreBadge(l)}</div><div class="detail-grid"><div><article class="panel"><h3>Publicatie</h3><p class="proof-detail-text">${e(l.summary)}</p><div class="chips">${l.trades.map(t=>`<span class="pill">${e(t)}</span>`).join('')}</div><a class="proof-source" href="${e(l.sourceUrl)}" target="_blank" rel="noopener">Open de originele publicatie</a></article><article class="panel"><h3>BAG, echt opgehaald</h3><dl class="property-grid"><div><dt>Bouwjaar</dt><dd>${e(l.year||'Onbekend')}</dd></div><div><dt>Oppervlakte</dt><dd>${e(l.area)} m²</dd></div><div><dt>Functie</dt><dd>${e(l.classification)}</dd></div></dl><p class="small muted">${e(l.uses.join(', '))}</p><p class="disclosure">Peildatum ${e(l.bagDate)} · ${e(l.postcode)}</p><p class="small muted">BAG-objecten ${e(l.bagIds.join(', '))}</p>${l.lat&&l.lon?`<div class="map-placeholder" id="map-area"><button class="btn outline sm" id="show-map">Kaart laden via OpenStreetMap</button></div>`:''}</article><article class="panel"><h3>Bedrijf op dit adres</h3><p class="notice">Niet opgehaald. De aparte KvK-test gebruikt fictieve bedrijven. Er wordt geen testbedrijf aan dit echte adres gekoppeld.</p></article></div><div><form class="panel" id="followup"><h3>Opvolging testen</h3><label class="proof-detail-controls">Status<select name="status">${options(STATUSES,l.status)}</select></label><label class="proof-detail-controls">Notitie<textarea name="note" maxlength="4000">${e(l.note)}</textarea></label><button class="btn" type="submit">Lokaal opslaan</button><p class="disclosure">Deze proef bewaart de status en notitie in jouw browser. Geen account of centrale database.</p></form><article class="panel"><h3>De score uitgelegd</h3>${l.factors.map(([factor,points])=>`<div class="score-factor"><span>${e(factor)}</span><b>+${points}</b></div>`).join('')}<p class="disclosure">Geen bedrijfspunten zolang geen echte KvK-verrijking voor dit adres is uitgevoerd.</p></article></div></div>`, 'projects');
  $('#followup').onsubmit = ev => { ev.preventDefault(); followups[id] = Object.fromEntries(new FormData(ev.target)); save(); notice('Opvolging in deze browser opgeslagen.'); };
  $('#show-map')?.addEventListener('click',()=>{const lat=Number(l.lat),lon=Number(l.lon),frame=document.createElement('iframe'); frame.title='Kaart van '+l.address; frame.className='location-map'; frame.referrerPolicy='no-referrer'; frame.src='https://www.openstreetmap.org/export/embed.html?bbox='+[lon-.006,lat-.003,lon+.006,lat+.003].join(',')+'&layer=mapnik&marker='+lat+','+lon; $('#map-area').replaceWith(frame); });
}
function mail() {
  const leads = validLeads().sort((a,b)=>b.score-a.score); shell(`<div class="proof-title"><h1>Zo ziet de ochtendmail eruit.</h1><p>Samengesteld uit de zakelijke projecten van jouw echte API-proef. Deze mail wordt niet verstuurd.</p></div><article class="panel proof-mail"><h3>${leads.length} projecten in jouw proef</h3><p class="notice">${report?.sourceMode==='reference'?'Archiefvoorbeelden uit de referentieproef.':'Momentopname van de laatste proef.'} Bedrijfsnamen zijn niet opgehaald.</p>${leads.slice(0,15).map(l=>`<div class="invoice-row"><span><b>${e(l.municipality)} · ${e(l.address)}</b><br>${e(l.summary)}<br><a class="text-button" href="#detail/${encodeURIComponent(l.id)}">Project bekijken</a></span>${scoreBadge(l)}</div>`).join('')||'<p class="muted">Geen nieuwe projecten uit de proef beschikbaar.</p>'}${leads.length>15?`<p class="small">En ${leads.length-15} meer bij Projecten.</p>`:''}</article>`, 'mail');
}
function profilePage() {
  shell(`<div class="proof-title"><h1>Jouw testprofiel</h1><p>Dit is een lokaal profiel voor de demonstratie. Het is geen beveiligd klantaccount. Je gegevens worden niet naar een API of naar GitHub verstuurd.</p></div><form class="form-card proof-profile" id="profile-form"><label class="block">Naam<input name="name" required maxlength="100" value="${e(profile.name||'')}"></label><label class="block">E-mailadres<input name="email" type="email" required maxlength="254" value="${e(profile.email||'')}"></label><button class="btn" type="submit">Testprofiel lokaal opslaan</button><button class="text-button" type="button" id="clear-profile">Profiel en opvolging wissen</button></form>`, 'profile');
  $('#profile-form').onsubmit = ev => {ev.preventDefault();profile=Object.fromEntries(new FormData(ev.target));save();profilePage();notice('Testprofiel opgeslagen. Er is geen inlogmail verstuurd.');}; $('#clear-profile').onclick=()=>{profile={};followups={};try{localStorage.removeItem(storage);}catch{}profilePage();notice('Lokaal profiel en opvolging gewist.');};
}
function download(name, text, type) { const link=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000); }
function route() { const [view,id]=(location.hash.slice(1)||'api').split('/'); if(view==='projects')projects();else if(view==='detail')detail(decodeURIComponent(id||''));else if(view==='mail')mail();else if(view==='profile')profilePage();else proofOverview();window.scrollTo(0,0); }
$('.skip').onclick=ev=>{ev.preventDefault();const main=$('main');main.tabIndex=-1;main.focus();};window.addEventListener('hashchange',route);route();
</script></body></html>
